name: GitHub Pages deployment proof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify published source and PWA assets
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "main"
          test -s index.html
          test -s manifest.webmanifest
          test -s mashati-sw.js
          test -s mashati-icon-192.png
          test -s mashati-icon-512.png
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "source=index.html" >> "$GITHUB_STEP_SUMMARY"
          sha256sum index.html manifest.webmanifest mashati-sw.js mashati-icon-192.png mashati-icon-512.png | tee -a "$GITHUB_STEP_SUMMARY"
